<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>Portal de Estágio e Gestão - Educ Centro de Ensino</title>
<meta charset="UTF-8">
<meta name="description" content="Portal de acompanhamento e gestão de estágio da Educ Centro de Ensino.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="Portal de Estágio e Gestão - Educ Centro de Ensino">
<meta property="og:description" content="Acesse o sistema de acompanhamento operacional, treinamentos e relatórios.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Educ Centro de Ensino">

<base target="_top">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --laranja: #FF9800;
    --laranja-escuro: #F57C00;
    --laranja-vivo: #ff6b00;
    --dourado: #FFC107;
    --dourado-suave: #d4af37;
    --creme: #fffdf5;
    --cinza-escuro: #3d3d3d;
    --cinza-medio: #757575;
    --cinza-borda: #ece8df;
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
      radial-gradient(circle at 12% 18%, rgba(255, 193, 7, 0.18), transparent 42%),
      radial-gradient(circle at 88% 82%, rgba(255, 152, 0, 0.16), transparent 45%),
      linear-gradient(135deg, #fffdf5 0%, #f5f2eb 55%, #ebe8e1 100%);
  }

  .login-container {
    background: #ffffff;
    padding: 42px 38px 36px 38px;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(61, 61, 61, 0.08), 0 4px 12px rgba(255, 152, 0, 0.08);
    width: 100%;
    max-width: 430px;
    text-align: center;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(212, 175, 55, 0.22);
    animation: fadeUp 0.45s ease-out;
  }

  .login-container::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 7px;
    background: linear-gradient(90deg, var(--dourado), var(--laranja), var(--laranja-vivo));
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .icon-box {
    background: linear-gradient(135deg, var(--dourado), var(--laranja));
    width: 82px;
    height: 82px;
    border-radius: 22px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 6px auto 18px auto;
    box-shadow: 0 10px 24px rgba(255, 152, 0, 0.30);
    border: 4px solid var(--creme);
  }

  .icon-box i {
    font-size: 36px;
    color: #ffffff;
  }

  .login-container h1 {
    color: var(--cinza-escuro);
    margin: 0 0 6px 0;
    font-size: 1.75em;
    font-weight: 800;
    letter-spacing: -0.3px;
  }

  .subtitulo {
    color: var(--cinza-medio);
    margin: 0 0 28px 0;
    font-size: 0.98em;
    font-weight: 500;
  }

  /* SELETOR DE PERFIL EM ABAS */
  .perfil-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    background: #f7f4ee;
    padding: 6px;
    border-radius: 14px;
    margin-bottom: 24px;
    border: 1px solid var(--cinza-borda);
  }

  .perfil-tab {
    border: none;
    background: transparent;
    color: var(--cinza-medio);
    padding: 12px 10px;
    border-radius: 10px;
    font-size: 0.95em;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .perfil-tab:hover {
    color: var(--cinza-escuro);
  }

  .perfil-tab.active {
    background: #ffffff;
    color: var(--laranja-escuro);
    box-shadow: 0 4px 12px rgba(255, 152, 0, 0.16);
    border: 1px solid rgba(255, 193, 7, 0.45);
  }

  .input-group {
    margin-bottom: 22px;
    text-align: left;
  }

  .input-group label {
    font-weight: 700;
    color: #555555;
    font-size: 0.88em;
    display: block;
    margin-bottom: 8px;
  }

  .password-wrapper {
    position: relative;
  }

  .password-wrapper input {
    width: 100%;
    padding: 14px 46px 14px 42px;
    border: 2px solid var(--cinza-borda);
    background: #fffefa;
    border-radius: 12px;
    font-size: 1em;
    transition: all 0.25s ease;
    color: var(--cinza-escuro);
  }

  .password-wrapper input:focus {
    border-color: var(--dourado);
    background: #ffffff;
    outline: none;
    box-shadow: 0 0 0 4px rgba(255, 193, 7, 0.18);
  }

  .input-icon-left {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #b0a899;
    font-size: 1em;
    pointer-events: none;
  }

  .toggle-pass {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: #9e9688;
    cursor: pointer;
    padding: 6px;
    font-size: 1em;
    transition: color 0.2s;
  }

  .toggle-pass:hover {
    color: var(--laranja-escuro);
  }

  .btn-login {
    background: linear-gradient(135deg, var(--laranja), var(--laranja-vivo));
    color: #ffffff;
    border: none;
    padding: 16px;
    width: 100%;
    border-radius: 12px;
    font-size: 1.08em;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255, 107, 0, 0.28);
    transition: all 0.25s ease;
    margin-top: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(255, 107, 0, 0.38);
    background: linear-gradient(135deg, var(--laranja-escuro), #e65100);
  }

  .btn-login:disabled {
    background: #bdbdbd;
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }

  .rodape-login {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #f2eee6;
    color: #9e9688;
    font-size: 0.82em;
  }

  /* MODAL DE ERRO CUSTOMIZADO */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(55, 50, 45, 0.65);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    backdrop-filter: blur(6px);
  }

  .modal-box {
    background: #ffffff;
    padding: 34px 30px;
    border-radius: 20px;
    text-align: center;
    max-width: 380px;
    width: 90%;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.22);
    border-top: 7px solid #f44336;
    animation: bounceIn 0.45s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
  }

  .modal-box i {
    font-size: 52px;
    color: #f44336;
    margin-bottom: 16px;
  }

  .modal-box h2 {
    margin: 0 0 10px 0;
    color: var(--cinza-escuro);
    font-size: 1.5em;
  }

  .modal-box p {
    color: var(--cinza-medio);
    font-size: 1em;
    line-height: 1.5;
    margin: 0 0 24px 0;
  }

  .modal-box button {
    background: linear-gradient(135deg, var(--laranja), var(--laranja-escuro));
    color: #ffffff;
    border: none;
    padding: 13px 32px;
    border-radius: 10px;
    font-size: 1em;
    cursor: pointer;
    font-weight: 700;
    transition: 0.2s;
    box-shadow: 0 4px 14px rgba(245, 124, 0, 0.3);
  }

  .modal-box button:hover {
    transform: scale(1.04);
    box-shadow: 0 6px 18px rgba(245, 124, 0, 0.4);
  }

  @keyframes bounceIn {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.05); opacity: 1; }
    70% { transform: scale(0.95); }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<div class="login-container">
  <div class="icon-box">
    <i class="fas fa-graduation-cap"></i>
  </div>
  <h1>Portal de Estágio</h1>
  <p class="subtitulo">Educ Centro de Ensino</p>

  <input type="hidden" id="login_tipo" value="Estagiario">
  <div class="perfil-tabs">
    <button type="button" class="perfil-tab active" id="tabEstagiario" onclick="selecionarPerfil('Estagiario')">
      <i class="fas fa-user-graduate"></i> Estagiário
    </button>
    <button type="button" class="perfil-tab" id="tabCoordenacao" onclick="selecionarPerfil('Coordenacao')">
      <i class="fas fa-user-tie"></i> Coordenação
    </button>
  </div>

  <div class="input-group">
    <label for="login_senha" id="lblCredencial">Credencial do Estagiário</label>
    <div class="password-wrapper">
      <i class="fas fa-key input-icon-left"></i>
      <input type="password" id="login_senha" placeholder="Digite sua senha de acesso" autocomplete="current-password">
      <button type="button" class="toggle-pass" onclick="alternarVisibilidadeSenha()" title="Mostrar/Ocultar senha">
        <i class="fas fa-eye" id="icoOlho"></i>
      </button>
    </div>
  </div>

  <button class="btn-login" onclick="fazerLogin()" id="btnAcesso">
    <i class="fas fa-sign-in-alt"></i> Entrar no Sistema
  </button>

  <div class="rodape-login">
    <i class="fas fa-shield-alt" style="color: #d4af37;"></i> Acesso restrito à equipe pedagógica e estagiários
  </div>
</div>

<!-- Modal Customizado de Alerta -->
<div class="modal-overlay" id="modalErro">
  <div class="modal-box">
    <i class="fas fa-exclamation-triangle"></i>
    <h2>Acesso Negado</h2>
    <p id="msgErro"></p>
    <button onclick="fecharErro()">Tentar Novamente</button>
  </div>
</div>

<script>
  // URL SINCRONIZADA COM COORDENACAO.HTML E ESTAGIARIO.HTML
  const API_URL = "https://script.google.com/macros/s/AKfycby224yOORGpwOR5Cck5_1SbFlu0AuJRkDHv2Ff1x8RAuyUTwn-3O_AF1-CflORNVZo/exec";

  function selecionarPerfil(tipo) {
    document.getElementById("login_tipo").value = tipo;
    document.getElementById("tabEstagiario").classList.toggle("active", tipo === "Estagiario");
    document.getElementById("tabCoordenacao").classList.toggle("active", tipo === "Coordenacao");
    document.getElementById("lblCredencial").innerText = (tipo === "Coordenacao") ? "Credencial da Coordenação" : "Credencial do Estagiário";
    document.getElementById("login_senha").focus();
  }

  function alternarVisibilidadeSenha() {
    var input = document.getElementById("login_senha");
    var ico = document.getElementById("icoOlho");
    if (input.type === "password") {
      input.type = "text";
      ico.className = "fas fa-eye-slash";
    } else {
      input.type = "password";
      ico.className = "fas fa-eye";
    }
  }

  // Acionar login com Enter e fechar modal com Esc/Enter
  document.getElementById("login_senha").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      fazerLogin();
    }
  });

  document.addEventListener("keydown", function(event) {
    var modal = document.getElementById("modalErro");
    if (modal.style.display === "flex" && (event.key === "Escape" || event.key === "Enter")) {
      fecharErro();
    }
  });

  function chamarAPI(action, payload, onSuccess) {
    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: action, payload: payload })
    })
    .then(res => res.json())
    .then(data => { if (onSuccess) onSuccess(data); })
    .catch(err => {
      mostrarErro("Erro de conexão com o servidor. Verifique a sua internet e tente novamente.");
      resetarBotao();
      console.error("Erro API:", err);
    });
  }

  function resetarBotao() {
    var btn = document.getElementById('btnAcesso');
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar no Sistema';
    btn.disabled = false;
  }

  function mostrarErro(msg) {
    document.getElementById('msgErro').innerText = msg;
    document.getElementById('modalErro').style.display = 'flex';
  }

  function fecharErro() {
    document.getElementById('modalErro').style.display = 'none';
    document.getElementById('login_senha').focus();
  }

  function fazerLogin() {
    var btn = document.getElementById('btnAcesso');
    var senha = document.getElementById("login_senha").value.trim();
    var tipo = document.getElementById("login_tipo").value;

    if (!senha) return mostrarErro("Por favor, digite sua credencial para acessar a plataforma!");

    btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Autenticando...';
    btn.disabled = true;

    if (tipo === "Coordenacao") {
      if (senha === "08041994") {
        window.open("Coordenacao.html", "_top");
      } else {
        mostrarErro("Credencial de Coordenação incorreta! Verifique os dados digitados.");
        resetarBotao();
      }
    } else {
      chamarAPI('verificarLoginEstagiario', { senha: senha }, function(res) {
        if (res && res.sucesso) {
          window.open("Estagiario.html?nome=" + encodeURIComponent(res.nome), "_top");
        } else {
          mostrarErro((res && res.msg) ? res.msg : "Não foi possível validar seus dados no momento.");
          resetarBotao();
        }
      });
    }
  }
</script>
</body>
</html>
